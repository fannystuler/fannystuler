name: Build Windows EXE (Rust)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        shell: pwsh
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Verify release binary exists
        shell: pwsh
        run: |
          $exe = "src-tauri/target/x86_64-pc-windows-msvc/release/zapret2-gui.exe"
          if (-not (Test-Path $exe)) {
            throw "Binary not found at $exe"
          }
          Get-Item $exe | Select-Object Name, Length, LastWriteTime

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapret2-gui-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/zapret2-gui.exe
          if-no-files-found: error
          retention-days: 14
