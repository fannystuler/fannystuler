name: Build Tauri Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Generate icon.ico
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons | Out-Null

          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(32, 32)
          $graphics = [System.Drawing.Graphics]::FromImage($bmp)
          $graphics.Clear([System.Drawing.Color]::FromArgb(255, 246, 130, 59))
          $icon = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $file = [System.IO.File]::Create("$PWD/src-tauri/icons/icon.ico")
          $icon.Save($file)
          $file.Dispose()
          $icon.Dispose()
          $graphics.Dispose()
          $bmp.Dispose()

          if (-not (Test-Path src-tauri/icons/icon.ico) -or (Get-Item src-tauri/icons/icon.ico).Length -eq 0) {
            throw "Failed to generate src-tauri/icons/icon.ico"
          }

      - name: Build Tauri app (x86_64-pc-windows-msvc)
        shell: pwsh
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapret2-gui-windows-x86_64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/zapret2-gui.exe
          if-no-files-found: error
