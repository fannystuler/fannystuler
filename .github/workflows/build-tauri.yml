name: Build Tauri Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app (x86_64-pc-windows-msvc)
        shell: pwsh
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapret2-gui-windows-x86_64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/zapret2-gui.exe
          if-no-files-found: error
