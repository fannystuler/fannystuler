name: AI Developer

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      task:
        description: "Задача для AI-разработчика (например: исправить lib.rs и настроить сборку)"
        required: true
        type: string
      target_branch:
        description: "Целевая ветка для PR"
        required: false
        default: "main"
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  develop:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      if: >-
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'ai-dev') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'ai-dev') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'ai-dev') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'ai-dev') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'ai-dev') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run AI Developer agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TASK_PROMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.task || format('{0}\n\n{1}', github.event.issue.title, github.event.issue.body) }}
          BASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || 'main' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "DEEPSEEK_API_KEY secret is not set"
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request

          api_key = os.environ["DEEPSEEK_API_KEY"]
          task = os.environ["TASK_PROMPT"]

          ignore_dirs = {".git", "target", "node_modules"}
          files_context = []
          total_chars = 0
          max_total_chars = 120000

          allow_ext = {".rs", ".toml", ".json", ".md", ".yml", ".yaml"}
          if os.path.splitext(fname)[1] not in allow_ext:
              continue
              dirs[:] = [d for d in dirs if d not in ignore_dirs]
              for fname in sorted(files):
                  fpath = os.path.join(root, fname)
                  if fname.endswith((".png", ".jpg", ".jpeg", ".ico", ".exe", ".dll", ".sys", ".lock")):
                      continue
                  try:
                      with open(fpath, "r", encoding="utf-8") as f:
                          content = f.read()
                  except Exception:
                      continue
                  if len(content) > 25000:
                      content = content[:25000] + "\n... [truncated]"
                  if total_chars + len(content) > max_total_chars:
                      continue
                  total_chars += len(content)
                  files_context.append(f"### FILE: {fpath}\n```\n{content}\n```")

          system_prompt = """Ты — senior Rust / Tauri v2 / Windows developer для проекта zapret2-gui (GUI-оболочка под Windows для управления процессом winws2.exe).
          Контекст:
          - Стек: Tauri v2, Rust, таргет x86_64-pc-windows-msvc, манифест src-tauri/Cargo.toml, CI в .github/workflows/.
          - Модули: lib.rs, config.rs, elevation.rs, engine.rs, lists.rs.
          - Пути окружения: ./config/profiles.json, ./lists/list-general.txt, бинарник winws2.exe, иконка src-tauri/icons/icon.ico.
          - Команды Tauri: get_env_status, list_profiles, set_active_profile, create_https_profile, preview_active_args, add_host_domain, start_engine, stop_engine; событие "engine-log".

          Верни СТРОГО валидный JSON без markdown-обертки вида:
          {
            "summary": "краткое описание изменений",
            "files": [
              {
                "path": "путь/к/файлу",
                "content": "полное новое содержимое файла"
              }
            ]
          }
          Не добавляй заглушек вроде todo!() или // .... Вноси только нужные для задачи правки."""

          user_prompt = f"Задача:\n{task}\n\nФайлы репозитория:\n\n" + "\n\n".join(files_context)

          payload = {
              "model": "deepseek-chat",
              "temperature": 0.2,
              "response_format": {"type": "json_object"},
              "messages": [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": user_prompt},
              ],
          }

          req = urllib.request.Request(
              "https://api.deepseek.com/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {api_key}",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  body = json.loads(resp.read().decode("utf-8"))
              raw_text = body["choices"][0]["message"]["content"]
              result = json.loads(raw_text)
          except Exception as e:
              raise SystemExit(f"AI request failed: {e}")
              body = json.loads(resp.read().decode("utf-8"))

          raw_text = body["choices"][0]["message"]["content"]
          result = json.loads(raw_text)

          changed = []
          for item in result.get("files", []):
              rel_path = os.path.normpath(item["path"])
              if os.path.isabs(rel_path) or rel_path.startswith(".."):
                  raise SystemExit(f"Refusing unsafe path: {rel_path}")
              new_content = item["content"]
              os.makedirs(os.path.dirname(rel_path) or ".", exist_ok=True)
              with open(rel_path, "w", encoding="utf-8", newline="\n") as f:
                  f.write(new_content)
              changed.append(rel_path)

          with open("ai_dev_summary.txt", "w", encoding="utf-8") as f:
              f.write(result.get("summary", "AI developer changes"))

          if not changed:
              print("No file changes produced by AI.")
              import sys

          print("Changed files:", ", ".join(changed))
          PY

      - name: Create branch, commit and open Pull Request
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi

          BRANCH_NAME="ai-dev/${GITHUB_RUN_ID}"
          SUMMARY=$(cat ai_dev_summary.txt)
          rm -f ai_dev_summary.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          Записать список изменённых файлов в файл (например, changed_files.txt) в Python-шаге и читать его здесь: git add -- $(cat changed_files.txt)
          SUMMARY=$(head -c 200 ai_dev_summary.txt | tr '\n' ' ')
          rm -f ai_dev_summary.txt
          BRANCH_NAME="ai-dev/issue-${ISSUE_NUMBER:-${GITHUB_RUN_ID}}"

          gh pr create \
            git ls-remote --exit-code --heads origin "$BASE_BRANCH" >/dev/null || { echo "Unknown base branch: $BASE_BRANCH"; exit 1; }
            --head "$BRANCH_NAME" \
            --title "AI Dev: ${SUMMARY}" \
            --body "Автоматически сгенерировано workflow \`AI Developer\` (run \`${GITHUB_RUN_ID}\`)."
        env:
          GH_TOKEN: ${{ github.token }}
